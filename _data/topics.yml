# 首页 Publications 的主题筛选（改版 v5 Hybrid）。不改论文本身（_posts / upcoming.yml）。
#
# list：筛选按钮，按这个顺序出现在 "All" 后面。id 会写进网址（#topic=<id>），改了旧链接就失效。
list:
  - id: gen
    label: Generative   # 2026-11-03 站主：原来叫 Controllable generation；id 不变，旧的 #topic=gen 照样能用
  - id: video
    label: Video
  - id: imaging
    label: "Imaging & cameras"
  - id: multimodal
    label: Multimodal
  - id: science
    label: "AI for Science"
  - id: restore
    label: "Restoration & SR"
  - id: eval
    label: Evaluation

# papers：论文网址 -> 主题（可以多个）。规则：
#   底子来自 categories —— GenAI → gen，AdverseWeather / SR → restore，IQA → eval；
#   再按 fields 和题目加：处理或生成视频 → video；相机 / 光学 / 事件相机 / 闪光 / 景深 → imaging；
#   输入跨模态（图像 + 文本、事件流 + RGB 帧）→ multimodal（只放站主点名的两篇：All-Weather VLM、TimeRewind）。
#   例外：Flash-Split 虽在 GenAI 分区，但它是去反射（扩散模型当先验），不算"可控生成"；
#         CodedEvents 虽在 AdverseWeather 分区，但它是光学设计，不算复原。
papers:
  "/whatif/": [gen, science]                         # In preparation · GenCast 热带气旋（站主 2026-10-31 加 AI for Science，只放这一篇）
  "/papers/allweathervlm/": [multimodal]             # 恶劣成像条件下的 VLM 鲁棒性（站主 2026-10-31 定：归多模态，不归复原）
  "/papers/real2sam2real/": [gen, video]             # 视频扩散 + 相机 / 物体控制
  "/papers/vid2bokeh/": [gen, video, imaging]        # 从视频合成光场 → 可控景深
  "/papers/shadowdirector/": [gen]                   # 人像阴影控制
  "/papers/flashsplit/": [imaging, restore]          # 闪光 + 扩散先验，2D 去反射
  "/papers/timerewind/": [gen, video, imaging, multimodal]  # 事件相机条件下的视频扩散插帧（事件流 + RGB 帧 → 也算多模态）
  "/papers/convrt/": [video, restore]                # 视频去湍流
  "/papers/flashsplat/": [imaging, restore]          # 闪光 + 高斯泼溅，3D 去反射
  "/papers/codedevent/": [imaging]                   # PSF 设计 + 事件相机 3D 追踪
  "/papers/assessor360/": [eval]                     # 360° 图像质量评价
  "/papers/snow/": [video, restore]                  # 视频去雪 + 数据集
  "/papers/srpo/": [restore]
  "/papers/vapsr/": [restore]
  "/papers/bsrn/": [restore]
  "/papers/cugan/": [restore]
  "/papers/pipal/": [eval]                           # 感知质量评价数据集 / 基准

# tags：每篇论文的标签（2026-11-03 站主定），显示在会议名下面（Publications 左栏、Selected work 卡片）。
# 不是固定的"类型 + 对象"，而是两三个最能说明这篇看点的词；词表尽量共用，同一个意思只用一个词。
# 生成类的工作第一个都是 Generative（不写 Diffusion Model）。
tags:
  "/whatif/":                 [Generative, Science, Controllability]
  "/papers/allweathervlm/":   [VLM, Robustness]
  "/papers/real2sam2real/":   [Generative, Video, Controllability]
  "/papers/vid2bokeh/":       [Generative, Editing, Camera]
  "/papers/shadowdirector/":  [Generative, Controllability, Lighting]
  "/papers/flashsplit/":      [Generative, Reflection removal]      # 扩散模型当先验的 2D 去反射
  "/papers/timerewind/":      [Generative, Video, Event camera]
  "/papers/convrt/":          [Video, Turbulence]
  "/papers/flashsplat/":      [3D, Reflection separation]        # 站主：是分离，不是去除
  "/papers/codedevent/":      [Optics, Event camera]
  "/papers/assessor360/":     [Image quality, "360°"]
  "/papers/snow/":            [Video, Dataset]
  "/papers/srpo/":            [Super-resolution, Graphics]
  "/papers/vapsr/":           [Super-resolution, Efficient]
  "/papers/bsrn/":            [Super-resolution, Efficient]
  "/papers/cugan/":           [Restoration, Interactive]
  "/papers/pipal/":           [Image quality, Dataset]

# 兜底：新加的论文没写进上面的 papers 时，按它的 categories（upcoming.yml 里是 category）归类
by_category:
  GenAI: [gen]
  AdverseWeather: [restore]
  SR: [restore]
  IQA: [eval]
