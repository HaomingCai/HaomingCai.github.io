<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>What If?</title>
<meta name="description" content="Guided Diffusion as a Tool for Scientific Inquiry into Tropical Cyclones.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EDEBE0;
    --ink: #1F1E1D;
    --ink2: #3D3929;
    --muted: #7B786C;
    --rule: #B9B8AC;
    --accent: #B01E1A;
    --gutter: 32px;
    --hero: min(1120px, calc(100vw - 2 * var(--gutter)));
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink2);
    font: 400 1.0625rem/1.6 Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* printed film grain over everything, including the animations */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 5; opacity: .55; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .2 0 0 0 0 .19 0 0 0 0 .15 1.4 0 0 0 -.72'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  a { color: inherit; }

  .wrap { width: var(--hero); margin: 0 auto; }
  header.top { padding-top: 40px; }
  .status {
    display: flex; gap: 18px; align-items: center; margin: 0 0 26px;
    font: 500 11px/1 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  }
  .status span + span::before { content: ""; display: inline-block; width: 3px; height: 3px; border-radius: 50%; background: var(--rule); margin-right: 18px; vertical-align: middle; transform: translateY(-1px); }

  h1 { margin: 0; font-family: Newsreader, Georgia, serif; font-weight: 400; color: var(--ink); }
  h1 .main { display: block; font-size: 4.5rem; line-height: 1; letter-spacing: -0.028em; font-variation-settings: "opsz" 72; }
  h1 .q { color: var(--accent); }
  h1 .sub { display: block; margin-top: .55rem; max-width: 30em; font-size: 1.5rem; line-height: 1.28; letter-spacing: -0.008em; color: var(--ink2); }
  .line { margin: 1.1rem 0 0; max-width: 60em; color: var(--ink2); text-wrap: pretty; }

  figure { margin: 0; }
  .hero { margin-top: 28px; }
  .frame { position: relative; width: 100%; aspect-ratio: 16 / 9; }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: transparent; }

  .second { margin-top: 64px; }

  footer { margin-top: 120px; padding: 28px 0 56px; font-size: .875rem; color: var(--muted); display: flex; justify-content: space-between; gap: 16px; }
  footer a { text-decoration: none; border-bottom: 1px solid var(--rule); padding-bottom: 1px; }
  footer a:hover { color: var(--ink); border-color: var(--ink); }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 720px) {
    :root { --gutter: 16px; }
    header.top { padding-top: 28px; }
    .status { margin-bottom: 18px; }
    h1 .main { font-size: 3.25rem; }
    h1 .sub { font-size: 1.25rem; }
    .line { font-size: 1rem; }
    .hero { margin-top: 24px; }
    /* hero straight under the title, the line after it */
    .top .wrap { display: flex; flex-direction: column; }
    .top .hero { order: 2; }
    .top .line { order: 3; margin-top: 18px; }
    footer { margin-top: 72px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <p class="status"><span>In preparation</span><span>Paper coming soon</span></p>
    <h1>
      <span class="main">What If<span class="q">?</span></span>
      <span class="sub">Guided Diffusion as a Tool for Scientific Inquiry into Tropical Cyclones</span>
    </h1>
    <p class="line">Sampling weather forecasts conditioned on a tropical-cyclone scenario, to explore rare but high-impact outcomes.</p>
    <figure class="hero">
      <div class="frame"><iframe src="concept.html?embed=1&amp;case=track" title="Animation: Typhoon Meranti ensemble, unguided versus guided onto a red target track" scrolling="no"></iframe></div>
    </figure>
  </div>
</header>

<main class="wrap">
  <figure class="second">
    <div class="frame"><iframe src="concept.html?embed=1&amp;case=irma" title="Animation: Hurricane Irma ensemble, unguided versus guided onto a red target track up the Florida peninsula" scrolling="no"></iframe></div>
  </figure>
</main>

<footer class="wrap">
  <a href="https://www.hm-cai.com/">Haoming Cai</a>
</footer>
</body>
</html>
