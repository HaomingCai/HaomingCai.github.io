  const base = () => ctx.setTransform(K, 0, 0, K, -crop[0] * K, -crop[1] * K);
  function panel(i, fn) { base(); ctx.save(); ctx.beginPath(); ctx.rect(PAN[i].x0, 0, PAN[i].x1 - PAN[i].x0, H); ctx.clip(); ctx.translate(PAN[i].ox, 0); fn(); ctx.restore(); }
  function text(txt, x, y, color, alpha, { size = 11, font = 'mono', align = 'left', baseline = 'top' } = {}) {
    if (alpha <= 0.01) return;
    const m = ctx.getTransform(), X = m.a * x + m.e, Y = m.d * y + m.f;
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    const fs = Math.round(size * dpr * clamp(Math.pow(scale * W / 1120, 0.35), 0.82, 1.15));
    ctx.font = font === 'mono' ? `500 ${fs}px "IBM Plex Mono", ui-monospace, monospace` : `600 ${fs}px Inter, system-ui, sans-serif`;
    try { ctx.letterSpacing = font === 'mono' ? `${(fs * 0.14).toFixed(1)}px` : '0px'; } catch (e) {}
    ctx.textAlign = align; ctx.textBaseline = baseline; ctx.globalAlpha = alpha;
    if (font !== 'mono') { ctx.lineJoin = 'round'; ctx.lineWidth = 3.5 * dpr; ctx.strokeStyle = 'rgba(237,235,224,.92)'; ctx.strokeText(txt, X, Y); }   // paper halo over dark cells
    ctx.fillStyle = color; ctx.fillText(txt, X, Y);
    ctx.restore();
  }
  // tick dots every 24 h along members (lead step k -> 12 + 12k hours)
  function ticks(sets, L, color, alpha) {
    if (alpha <= 0.003) return;
    ctx.fillStyle = color; ctx.globalAlpha = alpha; ctx.beginPath();
    const r = 1.5 * Math.sqrt(LW);
    for (const m of sets) for (let k = 1; k <= L + 1e-6; k += 2) { const idx = k * SM; if (idx > m.length - 1) break; const p = m[idx]; ctx.moveTo(p[0] + r, p[1]); ctx.arc(p[0], p[1], r, 0, Math.PI * 2); }
    ctx.fill(); ctx.globalAlpha = 1;
  }
  // 1-degree cells: crisp, device-pixel snapped squares
  // `under`: keys of cells already filled by the other group. Those get a crisp inset outline
  // instead of a fill, so the two distributions never blend into brown and both stay readable.
  function drawCells(bins, stops, t0, alpha, under = null) {
    if (alpha <= 0.003) return;
    const m = ctx.getTransform();
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    const lw = Math.max(1, Math.round(1.5 * dpr));
    for (const c of bins.cells) {
      const e = ease((curT - t0 - 0.55 - c.lead * 0.45) / 0.6);
      if (e <= 0) continue;
      const x0 = Math.round(m.a * c.r[0] + m.e), y0 = Math.round(m.d * c.r[1] + m.f), x1 = Math.round(m.a * c.r[2] + m.e), y1 = Math.round(m.d * c.r[3] + m.f);
      if (under && under.has(c.key)) {
        ctx.globalAlpha = e * alpha; ctx.strokeStyle = cmap(stops, 0.5 + 0.5 * c.v * lerp(0.6, 1, e)); ctx.lineWidth = lw;
        ctx.strokeRect(x0 + lw / 2 + 0.5 * dpr, y0 + lw / 2 + 0.5 * dpr, x1 - x0 - lw - dpr, y1 - y0 - lw - dpr);
        continue;
      }
      ctx.globalAlpha = 0.82 * e * alpha;
      ctx.fillStyle = cmap(stops, 0.16 + 0.84 * c.v * lerp(0.45, 1, e));
      ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    }
    ctx.restore();
  }
  // the 12-hourly points sliding to their cell centres: binning, made visible
  function drawBinning(bins, color, t0) {
    const a = sstep(t0, t0 + 0.25, curT) * (1 - sstep(t0 + 0.85, t0 + 1.25, curT));
    if (a <= 0.01 || !bins.dots.length) return;
    ctx.fillStyle = color; ctx.globalAlpha = a * 0.55; ctx.beginPath();
    const r = 1.35 * Math.sqrt(LW);
    for (const d of bins.dots) {
      const u = ease((curT - t0 - 0.12 - d[4] * 0.3) / 0.55);
      const x = lerp(d[0], d[2], u), y = lerp(d[1], d[3], u);
      ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2);
    }
    ctx.fill(); ctx.globalAlpha = 1;
  }
  // target track: thin dark-maroon dotted line, small dot at each lead time, a few lead-time labels
  function drawRoute(prog, alpha, labelA) {
    if (!ROUTE || prog <= 0 || alpha <= 0) return;
    const n = Math.max(2, Math.round(prog * (ROUTE.length - 1)) + 1), pts = ROUTE.slice(0, n);
    ctx.fillStyle = COL.maroon; ctx.globalAlpha = alpha;
    let acc = 0; ctx.beginPath();
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i], d = Math.hypot(b[0] - a[0], b[1] - a[1]);
      let s = 6 - acc;
      while (s <= d) { const u = s / d, x = lerp(a[0], b[0], u), y = lerp(a[1], b[1], u), rr = (1.25 + 0.25 * noise(x * .3)) * Math.sqrt(LW); ctx.moveTo(x + rr, y); ctx.arc(x, y, rr, 0, Math.PI * 2); s += 6; }
      acc = d - (s - 6);
    }
    ctx.fill();
    ctx.beginPath();
    for (let k = 0; k * SM < pts.length; k++) { const p = pts[k * SM], rr = 3.1 * Math.sqrt(LW); ctx.moveTo(p[0] + rr, p[1]); ctx.arc(p[0], p[1], rr, 0, Math.PI * 2); }
    ctx.fill(); ctx.globalAlpha = 1;
    if (labelA > 0 && routeLeads) {
      const want = [0, routeLeads.indexOf(target.lead_hours), routeLeads.length - 1].filter((v, i, a) => v >= 0 && a.indexOf(v) === i);
      for (const k of want) {
        if (k * SM >= pts.length) continue;
        const p = pts[k * SM], q = pts[Math.min(pts.length - 1, k * SM + 2)], o = pts[Math.max(0, k * SM - 2)];
        // put the label on the outside of the turn, off the line
        let nx = -(q[1] - o[1]), ny = q[0] - o[0]; const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
        if (nx < 0) { nx = -nx; ny = -ny; }
        text(`+${routeLeads[k]} h`, p[0] + nx * 12, p[1] + ny * 12, COL.maroon, labelA, { size: 12.5, font: 'sans', align: 'left', baseline: 'middle' });
      }
    }
  }
  function legend(items) {
    // layout in CSS pixels (not frame units), so rows keep their spacing at phone width
    const cssScale = clamp(Math.pow(scale * W / 1120, 0.35), 0.82, 1.15);
    const fs = 11 * cssScale, row = fs * 1.75, sw = fs * 0.95;
    const x0 = Math.max(10, 34 * scale * W / 1120), y0 = Math.max(10, 30 * scale * W / 1120);
    ctx.save(); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    items.forEach((it, i) => {
      if (it.a <= 0.01) return;
      const y = y0 + i * row;
      ctx.globalAlpha = it.a;
      if (it.kind === 'cell') { ctx.fillStyle = it.color; ctx.fillRect(x0, y + (fs - sw) / 2, sw, sw); }
      else { ctx.fillStyle = COL.maroon; for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(x0 + 1.3 + k * (sw - 2.6) / 2, y + fs / 2, 1.3, 0, Math.PI * 2); ctx.fill(); } }
      ctx.font = `500 ${Math.round(fs * dpr) / dpr}px "IBM Plex Mono", ui-monospace, monospace`;
      try { ctx.letterSpacing = `${(fs * 0.14).toFixed(2)}px`; } catch (e) {}
      ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.globalAlpha = it.a * 0.92; ctx.fillStyle = it.textColor;
      ctx.fillText(it.label, x0 + sw + fs * 0.7, y + fs / 2 + 0.5);
    });
    ctx.restore();
  }

  /* ===================== track cases (Meranti, Irma): lines -> density, on one map ===================== */
  let curT = 0;
  const TU = 2.5, TG = 7.5;          // when each group condenses into cells
  function drawTrack(t) {
    const out = 1 - sstep(11.6, 12.2, t);
    const Lu = ease((t - 0.2) / 1.9) * STEPS;
    const Lg = ease((t - 5.3) / 1.9) * STEPS;
    const many = UP.length > 40, thin = many ? 1.0 : 1.6;
    panel(0, () => {
      // unguided: lines, then binned
      drawCells(BU, BLUES, TU, out);
      const ua = (many ? 0.26 : 0.6) * (1 - sstep(TU + 0.1, TU + 0.8, t));
      for (let i = 0; i < UP.length; i++) charcoal(upTo(UP[i], Lu), trackW(seeds[i], thin), ua, seeds[i], COL.navy);
      ticks(UP, Lu, COL.navy, ua * 1.5);
      drawBinning(BU, COL.navy, TU);
      // guided: lines, then binned on top
      drawCells(BG, ORANGES, TG, out);   // semi-opaque over blue, as in the paper figure
      const ga = (many ? 0.36 : 0.8) * (1 - sstep(TG + 0.1, TG + 0.8, t));
      if (Lg > 0) { for (let i = 0; i < GP.length; i++) charcoal(upTo(GP[i], Lg), trackW(seeds[i] + 9, thin), ga, seeds[i] + 9, COL.orange); ticks(GP, Lg, COL.orange, ga * 1.5); }
      drawBinning(BG, COL.orange, TG);
      // target track over everything
      drawRoute(ease((t - 4.0) / 0.9), sstep(4.0, 4.15, t) * out, sstep(4.7, 5.1, t) * out);
      halftone(S[0], S[1], 18, COL.ink, 0.8 * sstep(0, 0.3, t) * (1 - sstep(TU + 0.3, TU + 0.9, t)));   // origin marker, gone once the cells take over
      if (showLabels) legend([
        { kind: 'cell', color: cmap(BLUES, 0.7), label: 'UNGUIDED', textColor: COL.navy, a: sstep(0.2, 0.6, t) * out },
        { kind: 'route', label: 'TARGET TRACK', textColor: COL.maroon, a: sstep(4.0, 4.4, t) * out },
        { kind: 'cell', color: cmap(ORANGES, 0.7), label: 'GUIDED', textColor: '#B5560F', a: sstep(5.3, 5.7, t) * out }
      ]);
    });
  }

  /* ===================== size case (Andrew): circles -> footprint density, diptych ===================== */
  const TS = 5.7;
  function drawSize(t) {
    const out = 1 - sstep(9.3, 9.9, t);
    const grow = ease((t - 0.15) / 1.2) * STEPS;
    const cur = ease((t - 1.6) / 3.4) * STEPS;
    const sw = sstep(1.55, 1.75, t) * (1 - sstep(TS + 0.1, TS + 0.8, t));
    const lines = 1 - sstep(TS + 0.1, TS + 0.8, t);
    const side = (sets, bins, stops, ink, ringA, lineA, sd) => {
      drawCells(bins, stops, TS, out);
      for (let i = 0; i < sets.length; i++) ribbon(upTo(sets[i], grow), trackW(seeds[i] + sd, 0.95), ink, lineA * lines, 0.5, seeds[i] + sd);
      ticks(sets, grow, ink, lineA * 1.4 * lines);
      if (sw <= 0) return;
      ctx.strokeStyle = ink; ctx.lineWidth = 0.9 * LW;
      for (const mk of MARKS) {
        if (mk > STEPS) continue;
        const vis = sstep(mk - 0.05, mk + 0.25, cur); if (vis <= 0) continue;
        ctx.globalAlpha = ringA * 0.55 * vis * sw; ctx.beginPath();
        for (const m of sets) { const p = atLead(m, mk); if (!p) continue; ctx.moveTo(p[0] + p[2], p[1]); ctx.arc(p[0], p[1], p[2], 0, Math.PI * 2); }
        ctx.stroke();
      }
      ctx.globalAlpha = ringA * sw * (1 - sstep(STEPS - 0.3, STEPS, cur) * 0.6); ctx.beginPath();
      for (const m of sets) { const p = atLead(m, cur); if (!p) continue; ctx.moveTo(p[0] + p[2], p[1]); ctx.arc(p[0], p[1], p[2], 0, Math.PI * 2); }
      ctx.stroke(); ctx.globalAlpha = 1;
    };
    const many = UP.length > 40;
    panel(0, () => {
      side(UP, BU, BLUES, COL.navy, many ? 0.24 : 0.45, many ? 0.24 : 0.45, 0);
      halftone(S[0], S[1], 16, COL.ink, 0.85);
      if (showLabels) text('UNGUIDED', 40, 38, COL.navy, 0.9);
    });
    panel(1, () => {
      side(GP, BG, ORANGES, COL.orange, many ? 0.26 : 0.5, many ? 0.3 : 0.5, 9);
      halftone(S[0], S[1], 16, COL.ink, 0.85);
      if (showLabels) text('GUIDED', 40, 38, '#B5560F', 1);
    });
  }

  const draw = t => {
    curT = t;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.drawImage(bgLayer, -crop[0] * K, -crop[1] * K);
    (IS_TRACK ? drawTrack : drawSize)(t);
  };
  const beatAt = IS_TRACK ? (t => t < TU ? 1 : t < 4.0 ? 2 : t < 5.3 ? 3 : t < TG ? 4 : t < 9 ? 5 : 6) : (t => t < 1.6 ? 1 : t < TS ? 2 : 3);

  /* ===================== loop ===================== */
  let forceStaticNow = false, lastBeat = 0, t0 = null, raf = 0, lastStaticT = STATIC_T;
  function post(b, t) {
    if (b === lastBeat) return; lastBeat = b;
    const msg = { beat: b, t, T, case: CASE };
    try { if (window.parent !== window) window.parent.postMessage(msg, '*'); } catch (e) {}
    window.dispatchEvent(new CustomEvent('whatif-beat', { detail: msg }));
  }
  function tick(now) { if (t0 === null) t0 = now; const t = ((now - t0) / 1000) % T; draw(t); post(beatAt(t), t); raf = requestAnimationFrame(tick); }
  let onScreen = true, pausedAt = null;
  function start() {
    cancelAnimationFrame(raf);
    forceStaticNow = forceStatic || RM.matches;
    resize();
    if (forceStaticNow) { lastStaticT = fixedT !== null ? fixedT : STATIC_T; draw(lastStaticT); }
    else { lastBeat = 0; t0 = null; pausedAt = null; draw(0); if (onScreen) raf = requestAnimationFrame(tick); }
  }
  // pause while offscreen; resume where it left off
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(entries => {
      const v = entries[entries.length - 1].isIntersecting;
      if (v === onScreen) return; onScreen = v;
      if (forceStaticNow) return;
      if (!v) { cancelAnimationFrame(raf); pausedAt = performance.now(); }
      else { if (pausedAt !== null && t0 !== null) t0 += performance.now() - pausedAt; pausedAt = null; cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); }
    }, { threshold: 0 }).observe(cv);
  }
  let rz = 0;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(start, 120); });
  if (RM.addEventListener) RM.addEventListener('change', start);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (forceStaticNow) draw(lastStaticT); document.documentElement.dataset.ready = '1'; });
  window.__whatifDraw = t => { forceStaticNow = true; cancelAnimationFrame(raf); lastStaticT = t; draw(t); };
  window.__whatifInfo = { CASE, nU: UP.length, nG: GP.length, STEPS, cellsU: BU.cells.length, cellsG: BG.cells.length, synthetic: !!raw.synthetic, basemapSynthetic: !!basemap.synthetic, storm: raw.storm || null };
  start();
})();
</script>
</body>
